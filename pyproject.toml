[project]
name = "media-jobs-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents inspect, submit and triage media-processing jobs safely."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.17",
    "mcp>=2.3,<3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
media-jobs-mcp = "media_jobs_mcp.server:main"
jobs-api = "media_jobs_mcp.jobs_api.app:main"
mjm-agent = "media_jobs_mcp.agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "respx>=0.23.1",
    "pgserver>=0.1.4",
    "pytest-asyncio>=1.4.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_jobs_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=media_jobs_mcp --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# CLI entrypoints; exercised end-to-end by the eval step in CI rather than by unit tests.
omit = ["src/media_jobs_mcp/agent/cli.py", "src/media_jobs_mcp/evals.py"]
