name: Feature request
description: Propose a change. Start from the problem, not the solution.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what they cannot do today.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable acceptance criteria.
