name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/media_jobs_test
      MJM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/media_jobs_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov-report=xml
      - name: Agent evals (deterministic baseline, regression gate)
        run: uv run python -m media_jobs_mcp.evals --min-pass 1.0

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t media-jobs-mcp:ci .
      - name: Smoke test (non-root, entrypoints installed)
        run: |
          test "$(docker run --rm media-jobs-mcp:ci id -u)" = "10001"
          docker run --rm media-jobs-mcp:ci media-jobs-mcp --help
          docker run --rm media-jobs-mcp:ci ffprobe -version | head -1

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-history scan with a pinned CLI image: same command as a local run, and independent
      # of push ranges (the first push to a new repo has no "before" commit).
      - name: Scan history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --no-banner --redact --exit-code 1
